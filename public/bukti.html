<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bukti Pendaftaran — SiPPDB</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { background: #e9e6df; }
    .bukti-aksi { max-width: 780px; margin: 20px auto 0; padding: 0 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .kertas { max-width: 780px; margin: 14px auto 40px; background: #fff; padding: 36px 40px; border-radius: 6px; box-shadow: var(--shadow-md); }
    .kop { display: flex; align-items: center; gap: 14px; border-bottom: 3px double var(--navy); padding-bottom: 14px; margin-bottom: 20px; }
    .kop h1 { font-size: 21px; margin: 0; }
    .kop p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
    .judul-bukti { text-align: center; font-family: 'Source Serif 4', serif; color: var(--navy); font-size: 17px; letter-spacing: 0.04em; margin: 0 0 4px; }
    .nomor-besar { text-align: center; font-size: 26px; font-weight: 700; letter-spacing: 0.06em; color: var(--navy); margin: 0 0 22px; }
    .data-diri { width: 100%; font-size: 13.5px; margin-bottom: 20px; }
    .data-diri td { padding: 5px 0; vertical-align: top; }
    .data-diri td:first-child { width: 170px; color: var(--muted); }
    .kertas .table-wrap { box-shadow: none; }
    .catatan-bukti { font-size: 12px; color: var(--muted); line-height: 1.6; border-top: 1px dashed var(--border); padding-top: 12px; margin-top: 20px; }
    .ttd { display: flex; justify-content: flex-end; margin-top: 28px; font-size: 12.5px; text-align: center; }
    @media print {
      body { background: #fff; }
      .bukti-aksi { display: none; }
      .kertas { box-shadow: none; margin: 0; padding: 0; max-width: none; }
      @page { size: A4; margin: 18mm; }
    }
    @media (max-width: 640px) { .kertas { padding: 22px 18px; } .data-diri td:first-child { width: 120px; } }
  </style>
</head>
<body>
  <div class="bukti-aksi">
    <a class="btn btn-outline" href="/">← Kembali</a>
    <button class="btn btn-primary" onclick="window.print()"><i data-ikon="cetak"></i> Cetak / Simpan PDF</button>
  </div>
  <div class="kertas" id="kertas">
    <p class="muted" style="text-align:center">Memuat bukti pendaftaran…</p>
  </div>
  <script src="/js/ikon.js"></script>
  <script src="/js/bukti.js"></script>
</body>
</html>
