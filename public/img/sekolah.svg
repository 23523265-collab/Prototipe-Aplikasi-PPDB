<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Ilustrasi gedung sekolah">
  <!-- Ilustrasi gedung SMA (dibuat untuk SiPPDB, bebas dipakai) -->
  <defs>
    <linearGradient id="dinding" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8eef6"/></linearGradient>
    <linearGradient id="atap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2552d"/><stop offset="1" stop-color="#9a3f1f"/></linearGradient>
    <linearGradient id="kaca" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#7fb2e5"/></linearGradient>
  </defs>
  <!-- tanah & halaman -->
  <ellipse cx="450" cy="402" rx="470" ry="30" fill="#cfe8d6"/>
  <rect x="0" y="388" width="900" height="32" fill="#bfe0c8"/>
  <path d="M330 420 L390 352 L510 352 L570 420 Z" fill="#e2e8f0"/>
  <!-- pohon belakang -->
  <g fill="#86c79a"><circle cx="70" cy="250" r="62"/><circle cx="120" cy="215" r="54"/><circle cx="820" cy="245" r="64"/><circle cx="770" cy="210" r="50"/></g>
  <g fill="#5fae78"><circle cx="40" cy="290" r="48"/><circle cx="860" cy="290" r="50"/></g>
  <!-- sayap kiri & kanan -->
  <g>
    <rect x="120" y="200" width="250" height="190" fill="url(#dinding)" stroke="#cbd5e1"/>
    <rect x="530" y="200" width="250" height="190" fill="url(#dinding)" stroke="#cbd5e1"/>
    <path d="M105 205 L245 150 L385 205 Z" fill="url(#atap)"/>
    <path d="M515 205 L655 150 L795 205 Z" fill="url(#atap)"/>
    <rect x="120" y="292" width="250" height="8" fill="#cbd5e1"/>
    <rect x="530" y="292" width="250" height="8" fill="#cbd5e1"/>
    <g fill="url(#kaca)" stroke="#94a3b8">
      <rect x="140" y="222" width="42" height="52" rx="3"/><rect x="198" y="222" width="42" height="52" rx="3"/><rect x="256" y="222" width="42" height="52" rx="3"/><rect x="314" y="222" width="42" height="52" rx="3"/>
      <rect x="140" y="316" width="42" height="52" rx="3"/><rect x="198" y="316" width="42" height="52" rx="3"/><rect x="256" y="316" width="42" height="52" rx="3"/><rect x="314" y="316" width="42" height="52" rx="3"/>
      <rect x="544" y="222" width="42" height="52" rx="3"/><rect x="602" y="222" width="42" height="52" rx="3"/><rect x="660" y="222" width="42" height="52" rx="3"/><rect x="718" y="222" width="42" height="52" rx="3"/>
      <rect x="544" y="316" width="42" height="52" rx="3"/><rect x="602" y="316" width="42" height="52" rx="3"/><rect x="660" y="316" width="42" height="52" rx="3"/><rect x="718" y="316" width="42" height="52" rx="3"/>
    </g>
  </g>
  <!-- bangunan tengah -->
  <rect x="360" y="160" width="180" height="230" fill="url(#dinding)" stroke="#cbd5e1"/>
  <path d="M340 168 L450 92 L560 168 Z" fill="url(#atap)"/>
  <circle cx="450" cy="138" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <rect x="380" y="176" width="140" height="22" rx="3" fill="#0f6cbd"/>
  <text x="450" y="192" text-anchor="middle" font-family="Poppins, Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">SMA NEGERI</text>
  <g fill="url(#kaca)" stroke="#94a3b8"><rect x="378" y="214" width="40" height="48" rx="3"/><rect x="482" y="214" width="40" height="48" rx="3"/></g>
  <rect x="420" y="300" width="60" height="90" rx="4" fill="#7c4a2d"/>
  <rect x="448" y="300" width="4" height="90" fill="#5b3420"/>
  <g fill="#e2e8f0"><rect x="372" y="300" width="10" height="90"/><rect x="518" y="300" width="10" height="90"/></g>
  <rect x="400" y="384" width="100" height="8" fill="#cbd5e1"/>
  <!-- tiang bendera merah putih -->
  <rect x="610" y="250" width="4" height="140" fill="#64748b"/>
  <rect x="614" y="252" width="44" height="14" fill="#dc2626"/>
  <rect x="614" y="266" width="44" height="14" fill="#ffffff" stroke="#e5e7eb"/>
  <!-- semak depan -->
  <g fill="#4f9d67"><ellipse cx="170" cy="392" rx="46" ry="16"/><ellipse cx="300" cy="394" rx="40" ry="14"/><ellipse cx="610" cy="394" rx="40" ry="14"/><ellipse cx="740" cy="392" rx="46" ry="16"/></g>
</svg>
