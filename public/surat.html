<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surat Keterangan Diterima — SiPPDB</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { background: #e9e6df; }
    .surat-aksi { max-width: 780px; margin: 20px auto 0; padding: 0 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .kertas { max-width: 780px; margin: 14px auto 40px; background: #fff; padding: 40px 48px; border-radius: 6px; box-shadow: var(--shadow-md); font-size: 14px; line-height: 1.7; color: #1f2430; }
    .kop { display: flex; align-items: center; gap: 14px; border-bottom: 3px double var(--navy); padding-bottom: 14px; margin-bottom: 22px; }
    .kop h1 { font-size: 21px; margin: 0; }
    .kop p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
    .judul-surat { text-align: center; margin: 0 0 22px; }
    .judul-surat strong { display: block; font-family: 'Source Serif 4', serif; color: var(--navy); font-size: 19px; letter-spacing: 0.05em; text-decoration: underline; text-underline-offset: 5px; }
    .judul-surat span { font-size: 13px; color: var(--muted); }
    .isi-surat td { padding: 3px 0; vertical-align: top; }
    .isi-surat td:first-child { width: 190px; }
    .isi-surat td:nth-child(2) { width: 16px; }
    .sekolah-tujuan { text-align: center; margin: 18px 0; padding: 14px; border: 1px solid #a7f3d0; background: #f0fdf6; border-radius: 8px; }
    .sekolah-tujuan small { display: block; color: #047857; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 11.5px; }
    .sekolah-tujuan strong { font-family: 'Source Serif 4', serif; font-size: 22px; color: var(--navy); }
    .catatan-surat { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 12px; margin-top: 26px; }
    .ttd { display: flex; justify-content: flex-end; margin-top: 30px; text-align: center; font-size: 13.5px; }
    @media print {
      body { background: #fff; }
      .surat-aksi { display: none; }
      .kertas { box-shadow: none; margin: 0; padding: 0; max-width: none; }
      @page { size: A4; margin: 20mm; }
    }
    @media (max-width: 640px) { .kertas { padding: 24px 18px; } .isi-surat td:first-child { width: 120px; } }
  </style>
</head>
<body>
  <div class="surat-aksi">
    <a class="btn btn-outline" href="/">← Kembali</a>
    <button class="btn btn-primary" onclick="window.print()"><i data-ikon="cetak"></i> Cetak / Simpan PDF</button>
  </div>
  <div class="kertas" id="kertas">
    <p class="muted" style="text-align:center">Memuat surat…</p>
  </div>
  <script src="/js/ikon.js"></script>
  <script src="/js/surat.js"></script>
</body>
</html>
